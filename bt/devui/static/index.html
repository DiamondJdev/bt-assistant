// Dev page for the voice pipeline.
// HTML is ugly and AI generated since this is an internal dev tool.

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BT — dev</title>
<style>
	:root { color-scheme: dark; --bg:#14161a; --panel:#1c1f26; --line:#2b3039;
		--fg:#e6e8ec; --dim:#878e9c; --accent:#6ea8fe; --user:#9ad0a0; --tool:#d3a24c; }
	* { box-sizing: border-box; }
	body { margin:0; font:14px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;
		background:var(--bg); color:var(--fg); }
	header { display:flex; gap:1.5rem; align-items:center; flex-wrap:wrap;
		padding:.75rem 1rem; border-bottom:1px solid var(--line); background:var(--panel); }
	header b { color:var(--accent); }
	header span { color:var(--dim); }
	button { font:inherit; padding:.4rem .9rem; border:1px solid var(--line);
		border-radius:4px; background:#262b34; color:var(--fg); cursor:pointer; }
	button:disabled { opacity:.45; cursor:not-allowed; }
	button.live { background:#5b2330; border-color:#7d3040; }
	main { display:grid; grid-template-columns:1fr 340px; gap:1px; background:var(--line);
		height:calc(100vh - 53px); }
	@media (max-width:820px) { main { grid-template-columns:1fr; height:auto; } }
	#log, aside { background:var(--bg); padding:1rem; overflow-y:auto; }
	.turn { margin-bottom:.85rem; white-space:pre-wrap; word-break:break-word; }
	.turn .who { color:var(--dim); font-size:12px; text-transform:uppercase;
		letter-spacing:.06em; display:block; }
	.turn.user .body { color:var(--user); }
	.turn.tool .body { color:var(--tool); font-size:13px; }
	.turn.partial .body { color:var(--dim); font-style:italic; }
	aside h2 { margin:0 0 .75rem; font-size:12px; letter-spacing:.08em;
		text-transform:uppercase; color:var(--dim); font-weight:600; }
	aside h2:not(:first-child) { margin-top:1.5rem; }
	table { width:100%; border-collapse:collapse; }
	td { padding:.2rem 0; vertical-align:top; }
	td:first-child { color:var(--dim); }
	td:last-child { text-align:right; font-variant-numeric:tabular-nums; }
	#status { margin-left:auto; color:var(--dim); }
	#status.on { color:var(--user); }
</style>
</head>
<body>
<header>
	<b>BT dev</b>
	<span>llm <em id="m-llm">…</em></span>
	<span>stt <em id="m-stt">…</em></span>
	<span>tts <em id="m-tts">…</em></span>
	<button id="mic">Connect &amp; talk</button>
	<span id="session"></span>
	<span id="status">idle</span>
</header>
<main>
	<div id="log"></div>
	<aside>
		<h2>Latency</h2>
		<table id="latency"><tbody></tbody></table>
		<h2>Tokens</h2>
		<table id="tokens"><tbody></tbody></table>
	</aside>
</main>
<script src="/dev/static/app.js"></script>
</body>
</html>
