<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#172c3b">
<title>BT</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header><h1>BT<span>Your personal assistant</span></h1></header>
<main>
  <section id="assistant" hidden aria-label="Conversation">
    <nav aria-label="Saved conversations">
      <label for="sessions">Conversation</label>
      <select id="sessions"><option value="">New conversation</option></select>
      <button id="new">New</button>
    </nav>
    <div id="log" role="log" aria-live="polite"><p class="empty">Type a message, or connect voice to talk.</p></div>
    <form id="chat">
      <label class="sr-only" for="message">Message BT</label>
      <textarea id="message" rows="2" maxlength="16000" placeholder="Message BT" required></textarea>
      <button id="send">Send</button>
    </form>
    <div class="voice">
      <button id="voice" type="button">Connect voice</button>
      <button id="talk" type="button" disabled aria-pressed="false">Hold to talk</button>
      <button id="stop" type="button">Stop audio</button>
    </div>
    <p class="hint">Voice works while this page is open. Disconnect voice to type.</p>
  </section>
  <p id="status" role="status" aria-live="polite">Connecting to server…</p>
</main>
<script type="module" src="/static/app.mjs"></script>
</body>
</html>
