<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#171717">
<title>BT</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="app">
  <aside id="sidebar" aria-label="Conversations">
    <div class="side-head">
      <span class="brand"><span class="avatar">BT</span>BT</span>
      <button id="close-side" class="icon only-mobile" type="button" aria-label="Close sidebar">✕</button>
    </div>
    <button id="new" class="new-chat" type="button">＋ New chat</button>
    <nav aria-label="Saved conversations"><ul id="sessions"></ul></nav>
    <dl class="health" aria-label="Connection status">
      <div><dt>Server</dt><dd><i class="dot" id="server-dot"></i><span id="server-text">Checking…</span></dd></div>
      <div><dt>Model</dt><dd id="model-text">—</dd></div>
      <div><dt>Voice</dt><dd><i class="dot" id="voice-dot"></i><span id="voice-text">Off</span></dd></div>
    </dl>
  </aside>
  <div id="scrim" hidden></div>

  <main>
    <header class="topbar">
      <button id="open-side" class="icon only-mobile" type="button" aria-label="Open conversations">☰</button>
      <h1 id="title">New chat</h1>
      <span id="conn" class="pill" data-state="checking" title="Connection to BT"><i class="dot"></i><span>Connecting…</span></span>
    </header>

    <div id="log" role="log" aria-live="polite"></div>

    <footer class="composer">
      <form id="chat" class="box">
        <label class="sr-only" for="message">Message BT</label>
        <textarea id="message" rows="1" maxlength="16000" placeholder="Message BT" required></textarea>
        <div class="row">
          <button id="voice" class="ghost" type="button" title="Start a voice session">🎙 Voice</button>
          <button id="send" class="send" aria-label="Send">↑</button>
        </div>
      </form>

      <section id="ptt" class="box ptt" hidden aria-label="Voice controls">
        <div class="ptt-state">
          <span id="voice-phase" data-phase="connecting">Connecting…</span>
          <span id="timer" aria-hidden="true"></span>
        </div>
        <button id="talk" type="button" disabled aria-pressed="false" aria-describedby="ptt-hint">
          <span class="ring" aria-hidden="true"></span>
          <span class="mic" aria-hidden="true">🎙</span>
          <span class="sr-only">Hold to talk</span>
        </button>
        <div class="meter" aria-hidden="true"><span id="meter"></span></div>
        <p id="ptt-hint" class="hint">Hold the button, or hold <kbd>Space</kbd>, while you speak. Release to send.</p>
        <div class="row">
          <button id="stop" class="ghost" type="button" disabled>Stop audio</button>
          <button id="end" class="ghost danger" type="button">End voice</button>
        </div>
      </section>
      <p id="status" role="status" aria-live="polite"></p>
    </footer>
  </main>
</div>
<script type="module" src="/static/app.mjs"></script>
</body>
</html>
