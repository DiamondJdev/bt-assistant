[project]
name = "bt-assistant"
version = "0.1.0"
description = "BT — a voice-native assistant"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "websockets>=13.0",
    "httpx>=0.27",
    "pydantic>=2.8",
    "faster-whisper>=1.0",
    "sounddevice>=0.4.7",
    "soundfile>=0.12",
    "numpy>=1.26",
    "openwakeword>=0.6",
    "openai>=3.15.0",
]

[project.scripts]
bt = "bt.main:run"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bt"]
